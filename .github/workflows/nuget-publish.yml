name: Publish Stable to nuget.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 0.1.0 or 0.1.0.0
        required: true

permissions:
  contents: read

jobs:
  stable_publish:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if tag commit is on main
        id: on_main
        shell: bash
        run: |
          git fetch origin main --prune
          if git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "ON_MAIN=true" >> "$GITHUB_ENV"
            echo "Tag commit is on main"
          else
            echo "ON_MAIN=false" >> "$GITHUB_ENV"
            echo "Tag commit is NOT on main; skip publish"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version from tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_INPUT="${{ inputs.version }}"
          else
            VERSION_INPUT="${GITHUB_REF_NAME#v}"
          fi

          VERSION_INPUT="$(printf '%s' "$VERSION_INPUT" | xargs)"
          echo "VERSION=$VERSION_INPUT" >> "$GITHUB_ENV"
          echo "Version=$VERSION_INPUT"

      - name: Restore
        run: dotnet restore MailKit.Pooling.sln

      - name: Build
        run: dotnet build MailKit.Pooling.sln -c Release --no-restore -m:1

      - name: Test
        run: dotnet test MailKit.Pooling.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/MailKit.Pooling/MailKit.Pooling.csproj -c Release --no-build -p:PackageVersion="${{ env.VERSION }}" -o ./artifacts

      - name: Push to nuget.org
        if: env.ON_MAIN == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            -s "https://api.nuget.org/v3/index.json" \
            -k "$NUGET_API_KEY" \
            --skip-duplicate
