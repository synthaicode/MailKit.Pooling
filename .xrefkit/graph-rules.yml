schema: xrefkit.graph-rules/v1
repository: MailKit.Pooling
profile_version: 1

# Requirement-independent traversal / pruning rules for TM candidate generation.
# Per-change TM, impacted-boundary list, per-PR traversal results, and seeds are
# NOT persisted here -- they are per-change artifacts.
traversal_policy:
  default_edges:
    - calls
    - type_reference
    - implements
    - inherits
  enabled_name_edges: []          # name coupling is not required for this repo
  weak_name_edges:
    - test_literal
    - environment_literal
  prune:
    - test_fixture_transit        # FakeClock / FakeSmtp* (fan-in 44) are transit
    - generated_noise

name_stoplist_applied: true

edge_status:
  emitted: [calls, implements, inherits, contains, declares, uses-name]
  planned: [type_reference, reads, writes, uses-config, uses-db]

notes: |
  Strongly-typed (Options pattern). Name edges are not required: shared literals
  are test hosts / env values, already type-bound through SmtpPoolOptions. The
  change centre is SmtpPool (ctor fan-in 57, AcquireLeaseAsync hot path). Test
  doubles are high fan-in but are pruned as transit so they do not flood the TM.
